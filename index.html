<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>PhotoDelete</title>
  <meta
    name="description"
    content="Clean your camera roll by swiping. Delete photos faster and free up storage."
  >

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100dvh;
      background:
        radial-gradient(circle at 50% 10%, #19181d 0%, #0d0d0f 38%, #080809 100%);
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .page {
      width: 100%;
      max-width: 430px;
      min-height: 100dvh;
      margin: 0 auto;
      padding: 58px 18px 28px;

      display: flex;
      flex-direction: column;
      text-align: center;
    }

    .logo {
      width: 96px;
      height: 96px;
      margin: 0 auto 20px;
      border-radius: 50%;
      object-fit: cover;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 25px;
      line-height: 1.15;
      font-weight: 700;
    }

    .description {
      margin: 0;
      font-size: 15px;
      line-height: 1.45;
      font-weight: 500;
    }

    .hint {
      display: block;
      margin-top: 2px;
      font-weight: 600;
    }

    .download {
      display: flex;
      align-items: center;
      justify-content: center;

      width: 100%;
      min-height: 64px;
      margin-top: 28px;
      padding: 0 24px;

      color: #fff;
      background: #000;
      border: 1px solid #29292d;
      border-radius: 13px;

      font-size: 16px;
      font-weight: 600;
      text-decoration: none;

      transition: transform 0.12s ease, opacity 0.12s ease;
    }

    .download:active {
      transform: scale(0.985);
      opacity: 0.85;
    }

    footer {
      margin-top: auto;
      padding-top: 70px;
      font-size: 12px;
    }

    footer a {
      color: #888;
      text-decoration: none;
    }

    footer a:hover {
      color: #bbb;
    }

    .separator {
      margin: 0 8px;
      color: #555;
    }

    @media (min-width: 600px) {
      .page {
        padding-top: 80px;
      }
    }
  </style>
</head>

<body>
  <main class="page">

    <img
      src="./logo.png"
      alt="PhotoDelete"
      class="logo"
    >

    <h1>PhotoDelete</h1>

    <p class="description">
      Clean your camera roll by swiping.<br>
      Delete photos faster &amp; free up storage.
      <span class="hint">Download on the iPhone App Store ↓</span>
    </p>

    <a
      class="download"
      href="https://apps.apple.com/app/id6762371378"
      aria-label="Download PhotoDelete on the App Store"
    >
      Download PhotoDelete
    </a>

    <footer>
      <a href="./impressum.html">Impressum</a>
      <span class="separator">·</span>
      <a href="./privacy.html">Privacy Policy</a>
    </footer>

  </main>
</body>
</html>
