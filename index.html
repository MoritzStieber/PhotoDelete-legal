<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>PhotoDelete</title>

  <meta
    name="description"
    content="Clean your camera roll by swiping. Delete photos faster and free up storage."
  >

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      min-height: 100%;
    }

    body {
      background:
        radial-gradient(
          circle at 50% 18%,
          #1b1920 0%,
          #111014 34%,
          #09090b 68%,
          #060607 100%
        );

      color: #ffffff;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;

      -webkit-font-smoothing: antialiased;
    }

    .page {
      width: 100%;
      max-width: 430px;

      min-height: 100vh;
      min-height: 100dvh;

      margin: 0 auto;
      padding: 24px 18px 18px;

      display: flex;
      flex-direction: column;
    }

    /*
      Hauptbereich:
      grundsätzlich vertikal zentriert,
      anschließend etwas nach oben verschoben.
    */
    .hero {
      flex: 1;

      display: flex;
      flex-direction: column;
      justify-content: center;

      text-align: center;

      transform: translateY(-38px);
    }

    .logo {
      display: block;

      width: 96px;
      height: 96px;

      margin: 0 auto 19px;

      border-radius: 50%;
      object-fit: cover;
    }

    h1 {
      margin: 0 0 8px;

      font-size: 25px;
      line-height: 1.15;
      font-weight: 700;

      letter-spacing: -0.4px;
    }

    .description {
      margin: 0;

      font-size: 15px;
      line-height: 1.4;
      font-weight: 500;
    }

    .download-hint {
      display: block;
      margin-top: 2px;

      font-weight: 600;
    }

    /*
      Hauptbutton
    */
    .download {
      position: relative;

      display: flex;
      align-items: center;
      justify-content: center;

      width: 100%;
      min-height: 64px;

      margin-top: 28px;
      padding: 0 68px;

      color: #ffffff;
      background: #111114;

      border: 1px solid #45454b;
      border-radius: 13px;

      box-shadow:
        0 7px 24px rgba(0, 0, 0, 0.28),
        inset 0 1px 0 rgba(255, 255, 255, 0.035);

      font-size: 16px;
      line-height: 1;
      font-weight: 600;

      text-decoration: none;

      transition:
        transform 0.12s ease,
        background 0.12s ease,
        border-color 0.12s ease;
    }

    .download:hover {
      background: #17171a;
      border-color: #55555b;
    }

    .download:active {
      transform: scale(0.985);
      background: #1a1a1d;
    }

    /*
      Apple-Systemzeichen.
      Wird auf iPhone / Mac nativ und sauber dargestellt.
    */
    .apple-icon {
      position: absolute;

      left: 21px;
      top: 50%;

      transform: translateY(-52%);

      width: 34px;

      text-align: center;

      color: #ffffff;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        sans-serif;

      font-size: 34px;
      line-height: 1;

      font-weight: 400;
    }

    /*
      Drei Punkte rechts wie bei Linktree.
      Nur visuelles Element – kein Menü.
    */
    .more {
      position: absolute;

      right: 20px;
      top: 50%;

      transform: translateY(-52%);

      color: #97979d;

      font-size: 22px;
      line-height: 1;
      font-weight: 700;
    }

    /*
      Legal Footer
    */
    footer {
      flex-shrink: 0;

      padding: 16px 0 4px;

      text-align: center;

      font-size: 13px;
      line-height: 1.4;
    }

    footer a {
      color: #a0a0a6;
      text-decoration: none;

      transition: color 0.12s ease;
    }

    footer a:hover,
    footer a:focus {
      color: #ffffff;
      text-decoration: underline;
    }

    .separator {
      margin: 0 9px;
      color: #5f5f64;
    }

    /*
      Kleine Smartphones:
      alles minimal kompakter halten.
    */
    @media (max-height: 650px) {
      .hero {
        transform: translateY(-20px);
      }

      .logo {
        width: 82px;
        height: 82px;
        margin-bottom: 15px;
      }

      .download {
        margin-top: 22px;
      }
    }

    /*
      Desktop / größere Displays
    */
    @media (min-width: 600px) {
      .page {
        padding-left: 24px;
        padding-right: 24px;
      }
    }
  </style>
</head>


<body>

  <main class="page">

    <section class="hero">

      <img
        src="./logo.png"
        alt="PhotoDelete"
        class="logo"
      >

      <h1>PhotoDelete</h1>

      <p class="description">
        Clean your camera roll by swiping.<br>
        Delete photos faster &amp; free up storage.

        <span class="download-hint">
          Download on the iPhone App Store ↓
        </span>
      </p>

      <a
        class="download"
        href="https://apps.apple.com/app/id6762371378"
        aria-label="Download PhotoDelete on the iPhone App Store"
      >

        <span
          class="apple-icon"
          aria-hidden="true"
        ></span>

        <span>
          Download PhotoDelete
        </span>

        <span
          class="more"
          aria-hidden="true"
        >⋮</span>

      </a>

    </section>


    <footer>

      <a href="./impressum.html">
        Impressum
      </a>

      <span class="separator">·</span>

      <a href="./website-privacy.html">
        Privacy Policy
      </a>

    </footer>

  </main>

</body>
</html>
